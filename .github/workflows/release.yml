name: Build DevStart 1.0
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the final release and remove intermediate builds of this version
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: devstart-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event.repository.private == false && github.ref == 'refs/heads/open-source'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_HTTP_TIMEOUT: '30'
      CARGO_NET_RETRY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check required signing configuration
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 scripts/sign-notarize-macos.py --check-config
      - name: Install Rust and both macOS targets
        shell: bash
        run: |
          set -euo pipefail
          if ! RUSTUP_DIST_SERVER=https://rsproxy.cn RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin --target x86_64-apple-darwin; then
            echo 'China Rust mirror unavailable; retrying official Rust distribution after the logged failure.'
            RUSTUP_DIST_SERVER=https://static.rust-lang.org RUSTUP_UPDATE_ROOT=https://static.rust-lang.org/rustup rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin --target x86_64-apple-darwin
          fi
          rustup default stable
          rustc --version
      - name: Fetch dependencies with explicit source fallback
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo fetch --locked; then
            echo 'China crate mirror unavailable; retrying official crates.io after the logged failure.'
            printf '' > .cargo/config.toml
            cargo fetch --locked
          fi
      - name: Verify public source
        run: |
          python3 scripts/test_publish_release.py
          python3 scripts/test_sign_notarize.py
          cargo fmt --check
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo test --locked --no-default-features
      - name: Package Universal app
        run: bash scripts/package-macos.sh --no-default-features
      - name: Verify the universal app before signing
        shell: bash
        run: |
          set -euo pipefail
          app=dist/DevStart.app
          binary="$app/Contents/MacOS/dev-start"
          test "$("$binary" --edition)" = open-source
          test "$("$binary" --version)" = 1.0.0
          lipo "$binary" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          xcrun vtool -show-build "$binary"
          python3 scripts/verify-api.py "$binary"
          DEVSTART_TEST_BINARY="$binary" python3 scripts/test-flutter-launch.py
      - name: Sign, notarize, staple and verify installable downloads
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 scripts/sign-notarize-macos.py
          python3 scripts/publish-release.py release-assets --check-only
      - name: Upload notarization diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DevStart-notarization-diagnostics
          path: ${{ runner.temp }}/devstart-notary-diagnostics/*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DevStart-1.0.0-macOS-universal
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish the final release for this version
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-release.py release-assets --sha "$GITHUB_SHA"
