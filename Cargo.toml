[package]
name = "dev-start"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A multi-project launch workbench for the AI Coding era"
license = "MIT"

[features]
default = []
personal = []

[dependencies]
egui_term = { path = "vendor/egui_term" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
egui_extras = { version = "0.33", default-features = false, features = ["syntect"] }
sha2 = "0.10"
egui-phosphor = { version = "0.11", features = ["fill"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-segmentation = "1.13"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen", "NSApplication", "NSMenu", "NSMenuItem"] }

objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSObject"] }
